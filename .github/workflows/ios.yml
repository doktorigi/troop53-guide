name: iOS build and tests

on:
  push:
    branches: [main, ios-port]
    paths: ['ios/**', 'app/src/main/assets/**', 'art/svg/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'app/src/main/assets/**', 'art/svg/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify shared content and illustration exports
        run: python3 ios/tools/check_resources.py
      - name: Build for iPhone and iPad
        run: |
          set -o pipefail
          xcodebuild -project ios/Troop53Guide.xcodeproj -scheme Troop53Guide -configuration Release -destination 'generic/platform=iOS' -derivedDataPath ios/DerivedData-device CODE_SIGNING_ALLOWED=NO build | tee ios/device-build.log
      - name: Choose iPhone simulator
        run: |
          xcrun simctl list devices available --json > /tmp/troop53-simulators.json
          SIMULATOR_ID=$(python3 - <<'PY'
          import json
          data = json.load(open('/tmp/troop53-simulators.json'))
          devices = [d for runtime, entries in data['devices'].items() if 'iOS-18-5' in runtime for d in entries if 'iPhone' in d['name']]
          devices.sort(key=lambda d: (d['name'] != 'iPhone 16 Pro', d['name']))
          assert devices, 'Missing iOS 18.5 iPhone simulator'
          print(devices[0]['udid'])
          PY
          )
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: Run unit and interface tests
        run: |
          set -o pipefail
          xcodebuild -project ios/Troop53Guide.xcodeproj -scheme Troop53Guide -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath ios/DerivedData -resultBundlePath ios/TestResults/Guide.xcresult -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test | tee ios/simulator-tests.log
      - name: Package simulator app
        run: |
          ditto -c -k --sequesterRsrc --keepParent ios/DerivedData/Build/Products/Debug-iphonesimulator/Troop53Guide.app ios/Troop53Guide-simulator.zip
          xcrun xcresulttool export attachments --path ios/TestResults/Guide.xcresult --output-path ios/TestResults/Screenshots
      - name: Upload simulator app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: troop53-ios-simulator
          path: ios/Troop53Guide-simulator.zip
          if-no-files-found: error
      - name: Upload test results and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: troop53-ios-test-results
          path: |
            ios/TestResults/
            ios/*.log
